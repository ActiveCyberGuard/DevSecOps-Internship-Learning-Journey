apiVersion: apps/v1
kind: Deployment

metadata:
  name: config-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: config-demo

  template:
    metadata:
      labels:
        app: config-demo

    spec:
      containers:
        - name: app
          image: nginx:alpine

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_NAME

            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD

          volumeMounts:
            - name: app-storage
              mountPath: /data

      volumes:
        - name: app-storage
          persistentVolumeClaim:
            claimName: app-pvc