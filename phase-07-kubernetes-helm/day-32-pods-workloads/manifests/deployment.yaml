apiVersion: apps/v1
kind: Deployment

metadata:
  name: devsecops-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devsecops-web

  template:
    metadata:
      labels:
        app: devsecops-web

    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80