replicaCount: 3

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: nginx
  host: devsecops.local

resources:

  requests:
    cpu: "100m"
    memory: "64Mi"

  limits:
    cpu: "500m"
    memory: "128Mi"

storage:
  size: 1Gi