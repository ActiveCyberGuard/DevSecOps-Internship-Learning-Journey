apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-web

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: devsecops-web

  template:
    metadata:
      labels:
        app: devsecops-web

    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 80

          resources:
            {{- toYaml .Values.resources | nindent 12 }}