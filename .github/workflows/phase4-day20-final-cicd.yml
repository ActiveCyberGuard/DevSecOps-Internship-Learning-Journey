
name: Phase 4 - Day 20 - Secure End-to-End CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "phase-04-cicd/day-20-final-cicd-project/**"
      - ".github/workflows/phase4-day20-final-cicd.yml"

  push:
    branches:
      - main
    paths:
      - "phase-04-cicd/day-20-final-cicd-project/**"
      - ".github/workflows/phase4-day20-final-cicd.yml"


permissions:
  contents: read
  packages: write


# ============================================================
# 1. APPLICATION TESTS
# ============================================================

jobs:

  test:
    name: Application Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r phase-04-cicd/day-20-final-cicd-project/app/requirements.txt

      - name: Run tests
        run: |
          cd phase-04-cicd/day-20-final-cicd-project
          PYTHONPATH=. pytest


# ============================================================
# 2. CODE QUALITY / LINT
# ============================================================

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flake8
        run: |
          pip install flake8

      - name: Run lint
        run: |
          flake8 phase-04-cicd/day-20-final-cicd-project/app


# ============================================================
# 3. DOCKER BUILD
# ============================================================

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test
      - lint

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-demo:${{ github.sha }} \
            phase-04-cicd/day-20-final-cicd-project


# ============================================================
# 4. CONTAINER SECURITY SCAN
# ============================================================

  scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build \
            -t devsecops-demo:${{ github.sha }} \
            phase-04-cicd/day-20-final-cicd-project

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-demo:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH


# ============================================================
# 5. PUBLISH IMAGE TO GITHUB CONTAINER REGISTRY
# ============================================================

  publish:
    name: Publish Container Image
    runs-on: ubuntu-latest
    needs: scan
    if: github.event_name == 'push'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/devsecops-demo:${{ github.sha }} \
            phase-04-cicd/day-20-final-cicd-project

      - name: Push image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/devsecops-demo:${{ github.sha }}


# ============================================================
# 6. STAGING DEPLOYMENT
# ============================================================

  staging:
    name: Staging Deployment
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'

    steps:

      - name: Deploy to staging
        run: |
          echo "================================="
          echo "STAGING DEPLOYMENT"
          echo "================================="

          echo "Image:"
          echo "ghcr.io/${{ github.repository_owner }}/devsecops-demo:${{ github.sha }}"

          echo "Deployment successful"

      - name: Health check
        run: |
          echo "================================="
          echo "HEALTH CHECK"
          echo "================================="

          echo "Running health check..."
          echo "HTTP 200 OK"
          echo "Application is healthy"


# ============================================================
# 7. ROLLBACK
# ============================================================

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: staging
    if: failure()

    steps:

      - name: Rollback deployment
        run: |
          echo "================================="
          echo "ROLLBACK"
          echo "================================="

          echo "Deployment failed."
          echo "Starting rollback..."
          echo "Restoring previous stable version..."
          echo "Rollback completed successfully."
