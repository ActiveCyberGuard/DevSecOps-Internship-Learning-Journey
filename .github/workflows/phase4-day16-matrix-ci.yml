name: Phase 4 - Day 16 - Matrix CI

on:
  push:
    branches:
      - main
    paths:
      - "phase-04-cicd/day-16-github-actions/**"
      - ".github/workflows/phase4-day16-matrix-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "phase-04-cicd/day-16-github-actions/**"
      - ".github/workflows/phase4-day16-matrix-ci.yml"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r phase-04-cicd/day-16-github-actions/requirements.txt

      - name: Run tests
        run: |
          cd phase-04-cicd/day-16-github-actions
          PYTHONPATH=. pytest