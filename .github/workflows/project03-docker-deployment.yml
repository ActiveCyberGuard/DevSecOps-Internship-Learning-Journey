name: Project 03 - Docker Deployment

on:
  push:
    branches:
      - main
    paths:
      - "phase-04-cicd/projects/project-03-docker-deployment/**"
      - ".github/workflows/project03-docker-deployment.yml"

  pull_request:
    branches:
      - main
    paths:
      - "phase-04-cicd/projects/project-03-docker-deployment/**"
      - ".github/workflows/project03-docker-deployment.yml"

jobs:
  build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t project03-app:${{ github.sha }} \
            phase-04-cicd/projects/project-03-docker-deployment

  deployment:
    name: Deployment Simulation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deployment
        run: |
          echo "================================="
          echo "Test Lab by MD.AL-AMIN"
          echo "================================="
          echo "Deploying application..."
          echo "Deployment successful"

      - name: Health Check
        run: |
          echo "Running health check..."
          echo "HTTP 200 OK"
          echo "Application is healthy"

  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: deployment
    if: failure()

    steps:
      - name: Rollback
        run: |
          echo "================================="
          echo "ROLLBACK"
          echo "================================="
          echo "Deployment failed."
          echo "Restoring previous stable version..."
          echo "Rollback completed."