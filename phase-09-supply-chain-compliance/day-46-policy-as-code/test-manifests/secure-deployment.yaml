apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-demo
  template:
    metadata:
      labels:
        app: secure-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.28-alpine
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
